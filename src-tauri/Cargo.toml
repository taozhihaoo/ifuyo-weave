[package]
name = "weave-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Weave Tauri desktop shell and application layer (IPC boundary)."

[lib]
name = "weave_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "weave"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
weave-core = { path = "../crates/weave-core" }
weave-files = { path = "../crates/weave-files" }
weave-history = { path = "../crates/weave-history" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = { version = "0.0.12" }
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
weave-testkit = { path = "../crates/weave-testkit" }

[lints]
workspace = true
