[package]
name = "weave-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Weave Tauri desktop shell and application layer (IPC boundary)."

[lib]
name = "weave_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "weave"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
weave-core = { path = "../crates/weave-core" }
weave-files = { path = "../crates/weave-files" }
weave-text = { path = "../crates/weave-text" }
weave-data = { path = "../crates/weave-data", features = ["specta"] }
weave-media = { path = "../crates/weave-media" }
weave-batch = { path = "../crates/weave-batch" }
weave-compare = { path = "../crates/weave-compare" }
weave-clipboard = { path = "../crates/weave-clipboard" }
weave-privacy = { path = "../crates/weave-privacy" }
sysinfo = { workspace = true }
# M2.8 OCR：Windows.Media.Ocr（WinRT 安全封装；workspace unsafe=forbid 不受影响）
windows = { version = "0.58", default-features = false, features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
] }
arboard = { workspace = true }
clipboard-win = { workspace = true }
image = { workspace = true }
ab_glyph = { workspace = true }
# M2.9 Wisp 规则引擎（确定性模式匹配 §37）
regex = "1"
# M2.10 Web（§1 审计：无既有 HTTP/HTML 解析 ⇒ 引入安全封装）
url = { workspace = true }
ureq = { workspace = true }
scraper = { workspace = true }
ego-tree = { workspace = true }
screenshots = "0.8"
x-win = "2"
weave-documents = { path = "../crates/weave-documents", features = ["specta"] }
weave-utilities = { path = "../crates/weave-utilities" }
weave-workflow = { path = "../crates/weave-workflow", features = ["specta"] }
csv = "1.4"
encoding_rs = { workspace = true }
weave-history = { path = "../crates/weave-history" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = { version = "0.0.12" }
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
weave-testkit = { path = "../crates/weave-testkit" }

[lints]
workspace = true
