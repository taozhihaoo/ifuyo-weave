[package]
name = "weave-batch"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Unified batch engine: Job / Preview / Execute / Cancel / Retry / Undo (M7)."

[dependencies]
weave-core = { path = "../weave-core" }
weave-text = { path = "../weave-text" }
weave-files = { path = "../weave-files" }
weave-media = { path = "../weave-media" }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
regex = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
