[package]
name = "weave-utilities"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "General utilities: hash / checksum / base64 / uuid / timestamp / url / regex / color (M9)."

[dependencies]
weave-core = { path = "../weave-core" }
weave-text = { path = "../weave-text" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
blake3 = "1"
crc = "3"
uuid = { version = "1", features = ["v4", "v7"] }
time = { version = "0.3", features = ["parsing", "formatting"] }
url = "2"
percent-encoding = "2"
regex = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
