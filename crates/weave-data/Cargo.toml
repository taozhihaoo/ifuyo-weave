[package]
name = "weave-data"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Structured data tools: CSV / JSON / TSV (M5)."

[dependencies]
specta = { version = "=2.0.0-rc.25", optional = true, features = ["derive"] }
weave-core = { path = "../weave-core" }
weave-text = { path = "../weave-text" }
csv = "1.4"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
regex = "1"

[features]
specta = ["dep:specta"]

[lints]
workspace = true
