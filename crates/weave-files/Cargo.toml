[package]
name = "weave-files"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "File and directory tools (M1 File Core): filesystem abstraction, metadata, hashing, inspector, analyzer."

[dependencies]
weave-core = { path = "../weave-core" }
weave-history = { path = "../weave-history" }
sha2 = "0.11"
serde = { workspace = true }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
weave-testkit = { path = "../weave-testkit" }

[lints]
workspace = true
