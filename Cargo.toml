[workspace]
resolver = "2"
members = [
    "crates/weave-core",
    "crates/weave-files",
    "crates/weave-text",
    "crates/weave-data",
    "crates/weave-documents",
    "crates/weave-media",
    "crates/weave-batch",
    "crates/weave-history",
    "crates/weave-search",
    "crates/weave-utilities",
    "crates/weave-workflow",
    "crates/weave-compare",
    "crates/weave-clipboard",
    "crates/weave-privacy",
    "crates/weave-testkit",
    "src-tauri",
]

[workspace.package]
version = "2.0.0-rc.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["ifuyo"]

[workspace.dependencies]
windows = { version = "0.58", default-features = false }
# M2.3 Clipboard：安全封装（workspace 禁 unsafe，不手写 Win32）。
arboard = "3"
clipboard-win = "5"

sysinfo = { version = "0.33", default-features = false, features = ["disk"] }
screenshots = "0.8"
x-win = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
# M2.8 Glint 标注 Text：字体解析/光栅化（纯 Rust 安全封装）。
ab_glyph = "0.2"
# M2.10 Web：WhatWG URL 解析 / 阻塞 HTTP 客户端（rustls）/ html5ever DOM。
url = "2"
# M2.12 Smart：EXIF 只读解析（与 weave-media 同一 kamadak 依赖 §2 复用）。
kamadak-exif = "0.6"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
scraper = "0.20"
ego-tree = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

# M4 Text：编码解码（Mozilla 维护，Firefox 同源）与结构化格式解析器。
encoding_rs = "0.8"
quick-xml = "0.38"
yaml-rust2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
