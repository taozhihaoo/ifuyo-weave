[workspace]
resolver = "2"
members = [
    "crates/weave-core",
    "crates/weave-files",
    "crates/weave-text",
    "crates/weave-data",
    "crates/weave-documents",
    "crates/weave-media",
    "crates/weave-batch",
    "crates/weave-history",
    "crates/weave-search",
    "crates/weave-testkit",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["ifuyo"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
